[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seima-mocap"
version = "0.1.0"
description = "Markerless human motion analysis base platform for SEIMA."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=1.0.1,<2",
    "numpy>=1.26,<3",
    "opencv-python>=4.9,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
seima-mocap = "seima_mocap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
