name: Ball tracking tests

on:
  push:
    branches:
      - feature/ball-tracking-core
  pull_request:
    paths:
      - "src/seima_mocap/ball_tracking.py"
      - "tests/test_ball_tracking.py"
      - "config/ball_tracking_defaults.json"
      - "scripts/validate_ball_tracking_synthetic.py"
      - ".github/workflows/ball-tracking-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run ball tracking tests
        run: pytest tests/test_ball_tracking.py -q
      - name: Run synthetic smoke test
        run: python scripts/validate_ball_tracking_synthetic.py
